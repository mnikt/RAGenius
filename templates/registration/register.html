{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Reggie - Rejestracja</title>
  <style>
    /* RESET STYLI / PODSTAWOWE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #0d6efd, #43c6ac);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .register-container {
      width: 400px;
      max-width: 90%;
      background-color: #fff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .register-container h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      color: #0d6efd;
    }

    .logo-subtitle {
      font-size: 0.9rem;
      color: #333;
      margin-bottom: 30px;
    }

    .user-icon {
      width: 80px;
      height: 80px;
      background-color: #e9ecef;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #6c757d;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"] {
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 100%;
      font-size: 1rem;
    }

    button {
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-primary {
      background-color: #0d6efd;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
    }

    .login-link {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #0d6efd;
      text-decoration: none;
    }

    .login-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="register-container">
    <!-- Logo / Tytuł -->
    <h1>REGGIE</h1>
    <div class="logo-subtitle">Dołącz do nas już teraz!</div>

    <!-- Ikonka użytkownika -->

    <!-- Formularz rejestracji -->
    <form method="POST" action="{% url 'register' %}">
      <input type="text" name="username" placeholder="Username" required />
      <input type="email" name="email" placeholder="Email" required />
      <input type="password" name="password1" placeholder="Password" required />
      <input type="password" name="password2" placeholder="Repeat Password" required />
      <button type="submit" class="btn-primary">Register</button>
    </form>

    <!-- Link do logowania, jeśli użytkownik ma już konto -->
    <a class="login-link" href="{% url 'login' %}">Masz już konto? Zaloguj się</a>
  </div>
</body>
</html>
