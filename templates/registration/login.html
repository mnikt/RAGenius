{% load static %} 
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>Reggie - Logowanie</title>
  <!-- Możesz dodać linki do zewnętrznych styli lub fontów tutaj -->
  <style>
    /* RESET STYLI / PODSTAWOWE */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(to bottom right, #0d6efd, #43c6ac);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-container {
      width: 400px;
      max-width: 90%;
      background-color: #fff;
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    .login-container h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      color: #0d6efd;
    }

    .logo-subtitle {
      font-size: 0.9rem;
      color: #333;
      margin-bottom: 30px;
    }

    .user-icon {
      width: 80px;
      height: 80px;
      background-color: #e9ecef;
      border-radius: 50%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      color: #6c757d;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    input[type="text"],
    input[type="password"] {
      padding: 12px;
      border-radius: 4px;
      border: 1px solid #ccc;
      width: 100%;
      font-size: 1rem;
    }

    button {
      padding: 12px;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .btn-primary {
      background-color: #0d6efd;
      color: #fff;
    }

    .btn-primary:hover {
      background-color: #0b5ed7;
    }

    .forgot-password {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.9rem;
      color: #0d6efd;
      text-decoration: none;
    }

    .forgot-password:hover {
      text-decoration: underline;
    }

    /* Dodatkowy przycisk “ZALOGUJ SIĘ” */
    .btn-secondary {
      background-color: #6c757d;
      color: #fff;
    }

    .btn-secondary:hover {
      background-color: #5a6268;
    }

  </style>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body>
  <div class="login-container">
    <!-- Logo / Tytuł -->
    <h1>REGGIE</h1>
    <div class="logo-subtitle">Mistrz pytań wielokrotnego wyboru</div>

    <!-- Ikonka użytkownika (np. placeholder) -->
    <div class="user-icon">
      <span class="material-icons">person</span>
      <!-- Jeśli nie masz Material Icons, usuń lub użyj innego rozwiązania (np. Font Awesome) -->
    </div>

    <!-- Formularz logowania -->
    <form method="POST" action="{% url 'login' %}">
      <input type="text" name="username" placeholder="Username" required />
      <input type="password" name="password" placeholder="Password" required />
      <button type="submit" class="btn-primary">Sign in</button>
    </form>

    <!-- Link "Forgot your password?" -->
    <a class="forgot-password" href="{% url 'register' %}">
      Don't have an account? Register here
    </a>

    <!-- Dodatkowy przycisk “ZALOGUJ SIĘ” (jeśli potrzebujesz innej akcji) -->
    <br><br>
  </div>
</body>
</html>
